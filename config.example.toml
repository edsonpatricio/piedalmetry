# Piedalmetry Configuration File
# ==============================
# Copy this file to /etc/piedalmetry/config.toml and edit as needed.
# All keys shown here with their default values.

[general]
# Enable mock mode: no real GPIO access (for development/testing)
# Type: bool | Default: false
mock_mode = false

# Log level: DEBUG, INFO, WARNING, ERROR
# Type: string | Default: "INFO"
log_level = "INFO"

# Log output target: "journald", "stdout", or "file"
# Type: string | Default: "stdout"
log_target = "stdout"

[brake]
# BCM GPIO pin number for ENA (PWM speed control)
# Type: int | Default: 18 | Valid: 0-27
brake_gpio_ena = 18  # physical pin 12

# BCM GPIO pin number for IN1 (direction control)
# Type: int | Default: 23 | Valid: 0-27
brake_gpio_in1 = 23  # physical pin 16

# BCM GPIO pin number for IN2 (direction control)
# Type: int | Default: 24 | Valid: 0-27
brake_gpio_in2 = 24  # physical pin 18

# PWM frequency in Hz
# Type: int | Default: 100 | Valid: 50-25000
brake_pwm_frequency = 100

# Minimum brake pressure (%) to activate the motor
# Below this value the motor stays off.
# Type: int | Default: 10 | Valid: 0-99
brake_min_pressure = 10

# Minimum motor duty cycle (%) at brake_min_pressure.
# Ramps linearly to 100% at brake_top_limit_pattern.
# Independent of brake_feedback_exponent (which only shapes frequency).
# Type: int | Default: 50 | Valid: 1-99
brake_min_strength = 50

# Minimum car speed (km/h) to activate the motor
# Motor stays off below this speed (e.g. stationary in pit).
# Type: int | Default: 0 | Valid: 0-500
brake_min_car_speed = 0

# Enable foot-on-pedal detection via a digital input pin.
# When enabled, the motor only activates while the pin reads LOW (foot on pedal).
# Set to false to disable and ignore the sensor entirely.
# Type: bool | Default: true
brake_foot_sensor_enabled = true

# BCM GPIO pin for the foot sensor signal (active LOW: LOW = foot on pedal, pull-up enabled).
# Type: int | Default: 25 | Valid: 0-27
brake_foot_sensor_gpio = 25  # physical pin 22

# BCM GPIO pin driven permanently HIGH to feed the sensor switch.
# Wire: feed pin → one leg of switch → signal pin. No external resistor needed.
# Type: int | Default: 21 | Valid: 0-27
brake_foot_sensor_feed_gpio = 21  # physical pin 40

# BCM GPIO pin for the foot-detection indicator LED.
# LED is LOW (off) at rest; turns HIGH (on) when a foot is detected on the pedal.
# Active regardless of brake_foot_sensor_enabled (which only gates the motor).
# Type: int | Default: 6 | Valid: 0-27
brake_foot_sensor_led_gpio = 6  # physical pin 31

# Pulse frequency range (Hz) across the braking zone.
# Frequency ramps from brake_min_pulse_freq at brake_min_pressure
# to brake_max_pulse_freq at brake_top_limit_pattern. Above the threshold
# the motor runs continuously at 100% (no pulsing).
# Type: float | Valid: 0.1-20.0
brake_min_pulse_freq = 3.0   # Hz at brake_min_pressure       | Default: 3.0
brake_max_pulse_freq = 12.0  # Hz at brake_top_limit_pattern  | Default: 12.0

# Response curve exponent applied to the pulse frequency ramp.
# Controls how quickly the frequency rises as brake pressure increases.
#   1.0 = linear (equal brake steps → equal frequency steps)
#   >1.0 = slow start / fast end (subtle at light braking, aggressive near limit)
# Type: float | Default: 3.0 | Valid: 0.1-10.0
brake_feedback_exponent = 3.0

# Brake pressure (%) above which the motor runs continuously at 100% power.
# Below this threshold the motor pulses at full power with increasing frequency.
# Must be greater than brake_min_pressure. Set to 0 to disable.
# Type: int | Default: 98 | Valid: 0, or (brake_min_pressure+1)-100
brake_top_limit_pattern = 98

[anti_fluctuation]
# Dead-zone threshold (%) — changes smaller than this are ignored
# to prevent motor flutter from telemetry noise.
# Type: float | Default: 2.0 | Valid: 0.0-50.0
dead_zone = 2.0

# Exponential moving average smoothing factor
# 0.0 = disabled (no EMA), 1.0 = no smoothing (raw values)
# Lower values = smoother but more latent
# Type: float | Default: 0.3 | Valid: 0.0-1.0
ema_alpha = 0.3

[playstation]
# PlayStation IP address. Leave empty for auto-discovery (same subnet only).
# For cross-subnet setups, enter the IP manually.
# Type: string | Default: ""
ip = "192.168.1.50"

# Human-friendly label for this console
# Type: string | Default: "PS5"
label = "PS5"

# BCM GPIO pin for the GT7 connection status LED.
# LED turns on when telemetry is connected, off when disconnected or service stops.
# Wire: GPIO pin → 220 Ω resistor → LED anode (longer leg) → LED cathode → GND.
# Type: int | Default: 17 | Valid: 0-27
ps_conn_led_gpio = 17  # physical pin 11
