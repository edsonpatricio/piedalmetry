[project]
name = "piedalmetry"
version = "0.3.7"
description = "GT7 brake-pressure-to-motor rumble feedback for Raspberry Pi 2B"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Edson Patricio"}]

dependencies = [
    "pycryptodome>=3.20",  # Salsa20 decryption with C extensions for ARMv7
    "tomli-w>=1.0",        # TOML write-back (tomllib is read-only in stdlib)
    "click>=8.1",          # CLI framework
    "gpiozero>=2.0",       # GPIO control (auto-detects lgpio/rpigpio backend)
]

[project.scripts]
piedalmetry = "piedalmetry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piedalmetry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

